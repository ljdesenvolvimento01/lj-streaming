
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b14">
    <title>LJ Streaming</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="brand">LJ<span>+</span></div>
        <p class="menu-label">MENU PRINCIPAL</p>

        <nav class="navigation">
            <button class="nav-item active" data-page="home">⌂ <span>Início</span></button>
            <button class="nav-item" data-page="live">▣ <span>TV ao vivo</span></button>
            <button class="nav-item" data-page="movies">▰ <span>Filmes</span></button>
            <button class="nav-item" data-page="series">▤ <span>Séries</span></button>
        </nav>

        <div class="sidebar-bottom">
            <div class="profile-avatar">LJ</div>
            <div>
                <strong>Meu Streaming</strong>
                <small>Entretenimento</small>
            </div>
        </div>
    </aside>

    <main class="main-content">
<header class="topbar">

    <button
        id="mobile-menu-toggle"
        class="mobile-menu-toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        type="button"
    >☰</button>

    <div class="mobile-brand">LJ<span>+</span></div>

    <div class="search-box">
        <span>⌕</span>
        <input
            id="pesquisa"
            type="search"
            placeholder="Buscar filmes, séries e canais..."
        >
    </div>

    <div class="user-profile">
        <span>●</span> Minha conta
    </div>

</header>


        <section id="hero" class="hero">
            <div class="hero-content">
                <span class="hero-tag">BEM-VINDO AO LJ STREAMING</span>
                <h1>Seu entretenimento.<br><span>Seu mundo.</span></h1>
                <p>Filmes, séries e televisão em um só lugar.</p>
                <button id="explorar" class="primary-button">
                    Explorar catálogo →
                </button>
            </div>
            <div class="hero-decoration"></div>
        </section>

        <section class="catalog-section" id="catalog-section">
            <div class="section-heading">
                <div>
                    <span class="section-label">DESCUBRA</span>
                    <h2 id="titulo">Em destaque</h2>
                </div>
                <span id="contador" class="counter"></span>
            </div>

            <div id="categorias" class="categories">
                <button class="category active" data-category="">
                    Todos
                </button>
            </div>

            <div id="conteudo" class="catalog-grid">
                <div class="loading">Carregando catálogo...</div>
            </div>
        </section>

        <footer>
            <span>© 2026 LJ STREAMING</span>
            <span>Seu entretenimento em um só lugar.</span>
        </footer>

    <main>
    </div>

<div id="mobile-menu-overlay" class="mobile-menu-overlay"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <button id="fechar-modal" class="close-modal">✕</button>
        <div id="modal-body"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
