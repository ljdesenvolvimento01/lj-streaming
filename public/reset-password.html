
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | LJ Streaming</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>LJ <span>STREAMING</span></h1>
            <h2>Nova senha</h2>
            <p>Digite o código recebido por e-mail e escolha sua nova senha.</p>

            <form id="resetForm">
                <input
                    type="email"
                    id="email"
                    placeholder="Seu e-mail"
                    required
                >

                <input
                    type="text"
                    id="codigo"
                    placeholder="Código de 6 dígitos"
                    minlength="6"
                    maxlength="6"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Nova senha (mínimo 8 caracteres)"
                    minlength="8"
                    maxlength="128"
                    required
                >

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirmar nova senha"
                    minlength="8"
                    maxlength="128"
                    required
                >

                <button type="submit">REDEFINIR SENHA</button>
                <p id="mensagem"></p>
            </form>

            <p><a href="/login.html">Voltar para o login</a></p>
        </section>
    </main>

    <script src="js/reset-password.js"></script>
</body>
</html>
