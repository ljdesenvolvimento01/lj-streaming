<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | LJ Streaming</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>LJ <span>STREAMING</span></h1>
            <h2>Recuperar senha</h2>
            <p>Informe seu e-mail para receber o código de recuperação.</p>

            <form id="forgotForm">
                <input type="email" id="email" placeholder="Seu e-mail cadastrado" required>
                <button type="submit">ENVIAR CÓDIGO</button>
                <p id="mensagem"></p>
            </form>

            <p><a href="/login.html">Voltar para o login</a></p>
        </section>
    </main>

    <script src="js/forgot-password.js"></script>
</body>
</html>
